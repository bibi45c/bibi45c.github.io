<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Docker command flow</title>
  <desc id="desc">ENTRYPOINT and CMD combine into a container process.</desc>
  <rect width="1200" height="675" fill="#0b1620"/>
  <rect x="72" y="76" width="1056" height="523" rx="28" fill="#10232d" stroke="#214553" stroke-width="2"/>
  <text x="120" y="148" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="32" font-weight="700">Docker command flow</text>
  <text x="120" y="190" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="20">one executable + default arguments</text>
  <rect x="120" y="278" width="235" height="92" rx="16" fill="#123542" stroke="#2dd4bf" stroke-width="2"/>
  <text x="158" y="334" fill="#ccfbf1" font-family="ui-monospace, monospace" font-size="25">ENTRYPOINT</text>
  <path d="M383 324h136" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
  <path d="M502 305l30 19-30 19" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="555" y="278" width="180" height="92" rx="16" fill="#172f4a" stroke="#60a5fa" stroke-width="2"/>
  <text x="610" y="334" fill="#dbeafe" font-family="ui-monospace, monospace" font-size="25">CMD</text>
  <path d="M763 324h136" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
  <path d="M882 305l30 19-30 19" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="935" y="278" width="145" height="92" rx="16" fill="#173a36" stroke="#5eead4" stroke-width="2"/>
  <text x="970" y="324" fill="#ccfbf1" font-family="ui-monospace, monospace" font-size="22">run</text>
  <text x="958" y="351" fill="#ccfbf1" font-family="ui-monospace, monospace" font-size="22">process</text>
  <text x="120" y="500" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="20">exec form keeps arguments and signals predictable</text>
