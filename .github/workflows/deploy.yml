name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Cloudflare cache purge
        run: node --test scripts/purge-cloudflare-cache.test.mjs
      - name: Verify accepted architecture bundle
        run: node scripts/check-architecture-bundle.mjs
      - name: Verify languages and article translations
        run: node scripts/check-bilingual.mjs
      - name: Verify article recommendations
        run: node scripts/check-recommendations.mjs
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      - name: Verify architecture files survive static export
        run: node scripts/check-architecture-bundle.mjs --export
      - name: Verify bilingual pages and exported links
        run: node scripts/check-bilingual.mjs --export
      - name: Verify exported recommendation cards
        run: node scripts/check-recommendations.mjs --export
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout purge script
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Purge Cloudflare cache after successful deployment
        run: node scripts/purge-cloudflare-cache.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
